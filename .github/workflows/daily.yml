name: Daily Development Activity

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate daily activity
        shell: bash
        run: |
          set -e

          DATE=$(date -u +"%Y-%m-%d")
          COUNT=$((RANDOM % 9 + 12))

          mkdir -p logs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Today's activity count: $COUNT"

          for ((i=1; i<=COUNT; i++)); do

            TIMESTAMP=$(date -u +"%H:%M:%S")
            FILE="logs/${DATE}.md"

            cat >> "$FILE" <<EOF

          ## Activity #${i}

          - Generated: ${DATE} ${TIMESTAMP} UTC
          - Automated repository maintenance
          - Activity sequence: ${i}/${COUNT}

          EOF

            git add "$FILE"

            git commit -m "chore: daily activity ${i}/${COUNT}"

            git push

            # Small random delay between commits
            sleep $((RANDOM % 20 + 5))

          done
